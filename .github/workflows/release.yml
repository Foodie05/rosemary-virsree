name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build management console
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd web
          pnpm install --frozen-lockfile
          VIRSREE_VERSION="$version" pnpm build
      - name: Build server and CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [[ "$os" == windows ]] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "release/rvsctl-$os-$arch$ext" ./cmd/rvsctl
          done
          server_ldflags="-s -w -X rosemary-virsree/internal/buildinfo.Version=$version -X rosemary-virsree/internal/buildinfo.Commit=$GITHUB_SHA"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$server_ldflags" -o release/rosemary-virsree-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$server_ldflags" -o release/rosemary-virsree-linux-arm64 ./cmd/server
          for arch in amd64 arm64; do
            bundle="release/bundle-$arch"
            mkdir -p "$bundle/web" "$bundle/downloads/rvsctl"
            cp "release/rosemary-virsree-linux-$arch" "$bundle/rosemary-virsree"
            cp -R web/dist "$bundle/web/dist"
            cp -R docs "$bundle/docs"
            for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
              os=${target%/*}; cli_arch=${target#*/}; ext=""
              [[ "$os" == windows ]] && ext=".exe"
              mkdir -p "$bundle/downloads/rvsctl/$os/$cli_arch"
              cp "release/rvsctl-$os-$cli_arch$ext" "$bundle/downloads/rvsctl/$os/$cli_arch/rvsctl$ext"
            done
            (cd "$bundle/downloads/rvsctl" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            tar -C "$bundle" -czf "release/rosemary-virsree-linux-$arch.tar.gz" .
            rm -rf "$bundle"
          done
          cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
