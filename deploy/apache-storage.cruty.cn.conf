<VirtualHost *:80>
    ServerName storage.cruty.cn
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName storage.cruty.cn
    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/api.cruty.cn/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/api.cruty.cn/privkey.pem
    SSLCipherSuite EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4
    SSLProtocol TLSv1.2 TLSv1.3
    SSLHonorCipherOrder On

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    ProxyPass / http://127.0.0.1:18741/ connectiontimeout=5 timeout=600 keepalive=On
    ProxyPassReverse / http://127.0.0.1:18741/

    ErrorLog /www/wwwlogs/storage.cruty.cn-error_log
    CustomLog /www/wwwlogs/storage.cruty.cn-access_log combined
</VirtualHost>
