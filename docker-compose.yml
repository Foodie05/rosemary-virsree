services:
  rosemary:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      RVS_LISTEN: 0.0.0.0:8080
      RVS_DATABASE: /data/rosemary.db
      RVS_WEB_DIR: /app/web/dist
      RVS_DOCS_DIR: /app/docs
      RVS_DOWNLOAD_DIR: /app/downloads
    volumes:
      - rosemary-data:/data

volumes:
  rosemary-data:
